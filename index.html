<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#042c53">
<title>手術室業務量報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--blue:#1a5fa8;--darkblue:#042c53;--red:#e34948;--amber:#eda100;--green:#1baf7a;--teal:#0f6e56;--purple:#4a3aa7;--border:rgba(0,0,0,0.08);--text:#0b0b0b;--text-sec:#52514e;--text-muted:#898781;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft JhengHei","PingFang TC",sans-serif;background:#f0efec;color:var(--text);min-height:100vh}
.app-header{background:linear-gradient(135deg,#042c53,#1a5fa8);padding:0 1.5rem;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(4,44,83,0.3)}
.app-title{font-size:15px;font-weight:600;color:#fff}
.year-selector{font-size:12px;padding:5px 10px;border-radius:4px;border:0.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;font-weight:500;display:none}
.year-selector option{color:#000;background:#fff}
.month-badge{font-size:11px;font-weight:500;background:rgba(255,255,255,0.2);color:#fff;padding:3px 10px;border-radius:999px}
.upload-btn{display:inline-flex;gap:5px;font-size:11px;padding:6px 12px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-weight:500;white-space:nowrap}
.upload-btn:hover{background:rgba(255,255,255,0.25)}
input[type=file]{display:none}
.cloud-bar{background:#fff;border-bottom:0.5px solid var(--border);padding:8px 1.5rem;display:flex;gap:8px;flex-wrap:wrap}
.cloud-btn{display:inline-flex;gap:5px;font-size:12px;padding:6px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:500;white-space:nowrap}
.btn-load{background:#1a5fa8;color:#fff}
.btn-save{background:#1baf7a;color:#fff}
.btn-settings{background:#f7f7f5;color:var(--text-sec);border:0.5px solid var(--border)}
.tab-bar{background:#f8fafd;border-bottom:2px solid #e0ecf8;padding:0 1.5rem;display:flex}
.tab-btn{font-size:13px;font-weight:500;padding:11px 16px;border:none;background:none;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:#0c3d6e;border-bottom-color:#0c3d6e;font-weight:600}
.container{max-width:1100px;margin:0 auto;padding:1.25rem 1.5rem 3rem}
.tab-panel{display:none}.tab-panel.active{display:block}
.year-info{background:linear-gradient(135deg,#f0f7ff,#e6f1fb);border-radius:12px;padding:1rem;margin-bottom:1.25rem;border-left:4px solid #0c3d6e}
.year-info-title{font-size:13px;font-weight:600;color:#0c3d6e}
.year-info-detail{font-size:12px;color:var(--text-sec)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.kpi-card{background:#fff;border-radius:12px;border:0.5px solid var(--border);padding:1rem}
.kpi-lbl{font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase}
.kpi-val{font-size:26px;font-weight:700;line-height:1}
.kpi-val.blue{color:#0c3d6e}.kpi-val.green{color:var(--teal)}.kpi-val.amber{color:var(--amber)}.kpi-val.red{color:var(--red)}.kpi-val.purple{color:var(--purple)}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.card{background:#fff;border-radius:12px;border:0.5px solid var(--border);padding:1.25rem;margin-bottom:12px}
.card-title{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:inline-block;width:3px;height:12px;background:var(--blue);border-radius:2px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:7px 8px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:#f7f7f5;white-space:nowrap}
tbody td{padding:7px 8px;border-bottom:0.5px solid var(--border);color:var(--text)}
tbody tr:hover td{background:#f7f7f5}
tbody tr.total-row td{background:#e6f1fb;font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:999px}
.b-em{background:#fcebeb;color:#a32d2d}
.b-ur{background:#faeeda;color:#854f0b}
.b-cr{background:#EEEDFE;color:#3C3489}
.b-ip{background:#e6f1fb;color:#185fa5}
.b-op{background:#eaf3de;color:#3b6d11}
.b-nt{background:#EEEDFE;color:#3C3489}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:2.5rem;text-align:center;cursor:pointer;margin-bottom:1.25rem}
.drop-zone:hover{border-color:var(--blue);background:#f0f7ff}
.drop-zone strong{color:var(--blue)}
.state-empty{text-align:center;padding:2.5rem;color:var(--text-muted);font-size:14px}
.modal-wrap{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:1.5rem;max-width:420px}
.modal h2{font-size:16px;font-weight:600;margin-bottom:.5rem}
.modal-field{margin-bottom:.75rem}
.modal-field label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px}
.modal-field input{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;font-size:13px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.btn-cancel{padding:7px 16px;border:0.5px solid var(--border);border-radius:8px;background:#f7f7f5;cursor:pointer;font-size:13px}
.btn-confirm{padding:7px 16px;border:none;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer;font-size:13px;font-weight:500}
.toast{display:none;position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:9999}
.q-upload-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1rem}
.q-upload-item{display:flex;flex-direction:column;gap:6px}
.q-upload-item label.inner{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:8px 12px;border-radius:8px;border:0.5px solid var(--border);background:#f7f7f5;color:var(--text-sec);cursor:pointer}
.q-upload-item label.inner:hover{background:#efefed}
.q-lbl{font-size:12px;color:var(--text-muted);font-weight:500}
.q-sel-btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-sec);cursor:pointer;transition:all .15s}
.q-sel-btn.active{background:#0c3d6e;color:#fff;border-color:#0c3d6e}
.q-sel-btn:hover:not(.active){background:#f0f4f8}
</style>
</head>
<body>

<header class="app-header">
  <span class="app-title">手術室業務量報表</span>
  <select id="year-selector" class="year-selector" onchange="switchYear(this.value)"></select>
  <span class="month-badge" id="month-badge">請上傳資料</span>
  <div style="flex:1"></div>
  <label class="upload-btn" for="file-main">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>
    上傳
    <input type="file" id="file-main" accept=".xls,.xlsx">
  </label>
</header>

<div class="cloud-bar">
  <button class="cloud-btn btn-load" onclick="loadFromGitHub()">讀取最新報表</button>
  <button class="cloud-btn btn-save" onclick="saveToGitHub()">儲存到雲端</button>
  <button class="cloud-btn btn-settings" onclick="showSettings()">設定 GitHub</button>
  <button class="cloud-btn" id="btn-export" onclick="exportExcel()" style="background:#4a3aa7;color:#fff;display:none">匯出 Excel</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('monthly')">📋 當月</button>
  <button class="tab-btn" onclick="switchTab('critical')">🔴 危急</button>
  <button class="tab-btn" onclick="switchTab('urgent')">🟡 緊急</button>
  <button class="tab-btn" onclick="switchTab('quarter')">📅 季報表</button>
  <button class="tab-btn" onclick="switchTab('annual')">📆 年度</button>
</div>

<div class="container">
  <div style="background:#fef8ed;border-radius:8px;padding:1rem;margin-bottom:1rem;border-left:4px solid var(--amber);display:none" id="debug-panel">
    <div style="font-size:12px;color:#854f0b">
      <strong>💡 如果解析失敗:</strong>
      <p style="margin-top:6px">1️⃣ 按 <kbd>F12</kbd> 打開開發者工具</p>
      <p>2️⃣ 切換到「Console」分頁</p>
      <p>3️⃣ 查看紅色的錯誤信息</p>
      <p>4️⃣ 確認 Excel 欄位名稱包含：「手術日期」、「科別名稱」、「手術別」</p>
    </div>
  </div>

  <div id="tab-monthly" class="tab-panel active">
    <label id="drop-zone" class="drop-zone" for="file-main2">
      <div style="font-size:2.5rem;margin-bottom:.5rem">📂</div>
      <strong>點擊或拖曳上傳「手術病患一覽表」</strong>
      <p>支援 .xls / .xlsx</p>
      <input type="file" id="file-main2" accept=".xls,.xlsx" style="display:none">
    </label>
    <div class="state-empty" id="monthly-empty">尚未載入資料</div>
    <div id="monthly-content" style="display:none"></div>
  </div>

  <div id="tab-critical" class="tab-panel">
    <div id="critical-content"><div class="state-empty">請先上傳手術資料</div></div>
  </div>

  <div id="tab-urgent" class="tab-panel">
    <div id="urgent-content"><div class="state-empty">請先上傳手術資料</div></div>
  </div>

  <div id="tab-quarter" class="tab-panel">
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">選擇季別</div>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <button class="q-sel-btn active" onclick="selectQuarter(1)">Q1（1-3月）</button>
        <button class="q-sel-btn" onclick="selectQuarter(2)">Q2（4-6月）</button>
        <button class="q-sel-btn" onclick="selectQuarter(3)">Q3（7-9月）</button>
        <button class="q-sel-btn" onclick="selectQuarter(4)">Q4（10-12月）</button>
      </div>
      <div id="q-month-labels" style="font-size:12px;color:var(--text-muted);margin-bottom:12px">
        上傳 1月、2月、3月 的手術病患一覽表
      </div>
      <div class="q-upload-grid">
        <div class="q-upload-item">
          <span class="q-lbl" id="q1-lbl">第1個月</span>
          <label class="inner" for="q-f1">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>
            <span id="q1-name">選擇 XLS/XLSX</span>
          </label>
          <input type="file" id="q-f1" accept=".xls,.xlsx" onchange="handleQ(1,this)" style="display:none">
        </div>
        <div class="q-upload-item">
          <span class="q-lbl" id="q2-lbl">第2個月</span>
          <label class="inner" for="q-f2">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>
            <span id="q2-name">選擇 XLS/XLSX</span>
          </label>
          <input type="file" id="q-f2" accept=".xls,.xlsx" onchange="handleQ(2,this)" style="display:none">
        </div>
        <div class="q-upload-item">
          <span class="q-lbl" id="q3-lbl">第3個月</span>
          <label class="inner" for="q-f3">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>
            <span id="q3-name">選擇 XLS/XLSX</span>
          </label>
          <input type="file" id="q-f3" accept=".xls,.xlsx" onchange="handleQ(3,this)" style="display:none">
        </div>
      </div>
    </div>
    <div id="quarter-content"></div>
  </div>

  <div id="tab-annual" class="tab-panel">
    <div id="annual-content"><div class="state-empty">年度統計</div></div>
  </div>
</div>

<div class="modal-wrap" id="settings-modal">
  <div class="modal">
    <h2>設定 GitHub</h2>
    <div class="modal-field"><label>GitHub 帳號</label><input id="s-user" type="text"></div>
    <div class="modal-field"><label>Repository</label><input id="s-repo" type="text"></div>
    <div class="modal-field"><label>Personal Access Token</label><input id="s-token" type="password"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn-confirm" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ 記憶系統 ═══
function saveMemory(){
  const memory = {
    yearData: window._yearData || {},
    annualData: window._annualData || {},
    currentYear: window._currentYear || null,
    quarterData: qData || {},
    currentQ: currentQ || 1
  };
  localStorage.setItem('surgery_report_memory_v1', JSON.stringify(memory));
  console.log('✓ 已保存到本地記憶');
}

function loadMemory(){
  try{
    const saved = localStorage.getItem('surgery_report_memory_v1');
    if(saved){
      const memory = JSON.parse(saved);
      window._yearData = memory.yearData || {};
      window._annualData = memory.annualData || {};
      window._currentYear = memory.currentYear || null;
      if(memory.quarterData) Object.assign(qData, memory.quarterData);
      currentQ = memory.currentQ || 1;
      return true;
    }
  }catch(e){console.error('讀取記憶失敗:', e);}
  return false;
}

// ═══ 全局變量 ═══
window._yearData = {};
window._annualData = {};
window._currentYear = null;
window._reportData = null;

const Q_MONTHS = {
  1: ['1月','2月','3月'],
  2: ['4月','5月','6月'],
  3: ['7月','8月','9月'],
  4: ['10月','11月','12月']
};
const qData = {1:null, 2:null, 3:null};
let currentQ = 1;

// ═══ UI 函數 ═══
function showToast(msg, ms=3000){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', ms);
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', ['monthly','critical','urgent','quarter','annual'][i]===tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

function selectQuarter(q){
  currentQ = q;
  document.querySelectorAll('.q-sel-btn').forEach((b,i)=>{b.classList.toggle('active',i===q-1);});
  const months = Q_MONTHS[q];
  document.getElementById('q-month-labels').textContent = `上傳 ${months[0]}、${months[1]}、${months[2]} 的手術病患一覽表`;
  document.getElementById('q1-lbl').textContent = months[0];
  document.getElementById('q2-lbl').textContent = months[1];
  document.getElementById('q3-lbl').textContent = months[2];
  qData[1]=null;qData[2]=null;qData[3]=null;
  ['q1-name','q2-name','q3-name'].forEach(id=>document.getElementById(id).textContent='選擇 XLS/XLSX');
  document.getElementById('quarter-content').innerHTML='';
}

function handleQ(n,input){
  const file=input.files[0];if(!file)return;
  document.getElementById('q'+n+'-name').textContent=file.name;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=parseFile(ev.target.result);
      if(!d) return;
      qData[n]=d;
      // 用 年-月 作為key
      const monthKey = d.year + '-' + (d.month.match(/(\d+)月/) ? d.month.match(/(\d+)月/)[1].padStart(2,'0') : '00');
      if(!window._yearData[monthKey]) window._yearData[monthKey] = d;
      tryMergeQuarter();
    }catch(e){alert('第'+n+'個月解析失敗：'+e.message);}
  };
  reader.readAsArrayBuffer(file);
}

function tryMergeQuarter(){
  const loaded=[1,2,3].filter(i=>qData[i]);
  if(loaded.length===0)return;
  const months=loaded.map(i=>qData[i].month).join('、');
  const qLabel=`Q${currentQ}（${Q_MONTHS[currentQ].join('、')}）`;
  let total=0,emg=0,urgent=0,critical=0,inpatient=0,outpatient=0;
  const dm={};
  loaded.forEach(i=>{
    const d=qData[i];
    total+=d.total;emg+=d.emg;urgent+=d.urgent||0;critical+=d.critical||0;inpatient+=d.inpatient;outpatient+=d.outpatient;
    d.dept.forEach(r=>{
      if(!dm[r.name])dm[r.name]={name:r.name,total:0,emg:0,urgent:0,critical:0,inpatient:0,outpatient:0};
      const m=dm[r.name];
      m.total+=r.total;m.emg+=r.emg;m.urgent+=r.urgent||0;m.critical+=r.critical||0;m.inpatient+=r.inpatient;m.outpatient+=r.outpatient;
    });
  });
  renderQuarter({qLabel,months,total,emg,urgent,critical,inpatient,outpatient,dept:Object.values(dm),monthData:loaded.map(i=>qData[i])});
  
  // 更新年度報表：合併所有年份
  const annualYears = {};
  Object.keys(window._yearData).forEach(monthKey => {
    const monthData = window._yearData[monthKey];
    const year = monthData.year;
    
    if(!annualYears[year]){
      annualYears[year] = {
        year: year,
        total: 0,
        emg: 0,
        urgent: 0,
        critical: 0,
        inpatient: 0,
        outpatient: 0,
        dept: {}
      };
    }
    
    const aData = annualYears[year];
    aData.total += monthData.total;
    aData.emg += monthData.emg;
    aData.urgent += monthData.urgent || 0;
    aData.critical += monthData.critical || 0;
    aData.inpatient += monthData.inpatient;
    aData.outpatient += monthData.outpatient;
    
    monthData.dept.forEach(r => {
      if(!aData.dept[r.name]){
        aData.dept[r.name] = {name: r.name, total: 0, emg: 0, urgent: 0, critical: 0, inpatient: 0, outpatient: 0};
      }
      aData.dept[r.name].total += r.total;
      aData.dept[r.name].emg += r.emg || 0;
      aData.dept[r.name].urgent += r.urgent || 0;
      aData.dept[r.name].critical += r.critical || 0;
      aData.dept[r.name].inpatient += r.inpatient || 0;
      aData.dept[r.name].outpatient += r.outpatient || 0;
    });
  });
  
  Object.keys(annualYears).forEach(year => {
    annualYears[year].dept = Object.values(annualYears[year].dept);
  });
  
  window._annualData = annualYears;
  renderAnnual(annualYears);
  saveMemory();
}

function renderQuarter(d){
  const monthRows=d.monthData.map(m=>`<tr>
    <td>${m.month}</td><td class="num">${m.total}</td>
    <td class="num">${m.inpatient}</td><td class="num">${m.outpatient}</td>
    <td class="num"><span class="badge b-em">${m.emg}</span></td>
  </tr>`).join('');
  
  const dSorted=[...d.dept].sort((a,b)=>b.total-a.total);
  document.getElementById('quarter-content').innerHTML=`
    <div class="year-info">
      <div class="year-info-title">📅 ${d.qLabel}</div>
      <div class="year-info-detail">已載入：${d.months}</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-lbl">季總台數</div><div class="kpi-val blue">${d.total}</div></div>
      <div class="kpi-card"><div class="kpi-lbl">住院手術</div><div class="kpi-val green">${d.inpatient}</div><div class="kpi-sub">${(d.inpatient/d.total*100).toFixed(1)}%</div></div>
      <div class="kpi-card"><div class="kpi-lbl">門診手術</div><div class="kpi-val amber">${d.outpatient}</div><div class="kpi-sub">${(d.outpatient/d.total*100).toFixed(1)}%</div></div>
      <div class="kpi-card"><div class="kpi-lbl">急診手術</div><div class="kpi-val red">${d.emg}</div></div>
    </div>
    <div class="card">
      <div class="card-title">各月業務量比較</div>
      <div class="table-wrap"><table>
        <thead><tr><th>月份</th><th class="num">總台數</th><th class="num">住院</th><th class="num">門診</th><th class="num">急診</th></tr></thead>
        <tbody>${monthRows}
          <tr class="total-row"><td>季合計</td><td class="num">${d.total}</td>
            <td class="num">${d.inpatient}</td><td class="num">${d.outpatient}</td>
            <td class="num"><span class="badge b-em">${d.emg}</span></td>

function updateYearSelector(){
  const selector = document.getElementById('year-selector');
  
  // 從monthKeys中提取唯一的年份
  const monthKeys = Object.keys(window._yearData).sort().reverse();
  const years = [...new Set(monthKeys.map(k => k.split('-')[0]))].sort().reverse();
  
  if(years.length === 0){
    selector.style.display = 'none';
    return;
  }
  
  selector.style.display = 'inline-block';
  selector.innerHTML = years.map(y => {
    const monthsInYear = monthKeys.filter(k => k.startsWith(y+'-')).sort().reverse();
    return `<option value="${y}" title="已上傳: ${monthsInYear.map(k => k.split('-')[1] + '月').join(', ')}">${y}年（${monthsInYear.length}個月）</option>`;
  }).join('');
  
  if(!window._currentYear || !years.includes(window._currentYear)){
    window._currentYear = years[0];
  }
  selector.value = window._currentYear;
}

function switchYear(year){
  window._currentYear = year;
  // 找出该年份的最新月份
  const monthKeys = Object.keys(window._yearData).filter(k => k.startsWith(year+'-')).sort().reverse();
  if(monthKeys.length === 0) return;
  
  const latestMonthKey = monthKeys[0];
  const data = window._yearData[latestMonthKey];
  if(!data) return;
  
  window._reportData = data;
  renderMonthly(data);
  renderCritical(data.critRows, data.critRate, data.critOk);
  renderUrgent(data.urgRows, data.urgRate, data.urgOk);
}

// ═══ 解析 ═══
function parseFile(arrayBuffer){
  try{
    const wb = XLSX.read(arrayBuffer, {type:'array'});
    console.log('📊 工作表:', wb.SheetNames);
    
    const sh = wb.SheetNames.find(s=>s.includes('手術') || s.includes('一覽')) 
              || wb.SheetNames[wb.SheetNames.length-1]
              || wb.SheetNames[0];
    
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sh], {header:1, defval:''});
    console.log('📈 總行數:', rows.length);
    
    let hdr = 0;
    // 尋找表頭行：應該包含關鍵欄位如「手術日期」、「科別名稱」等
    for(let i=0; i<Math.min(rows.length, 15); i++){
      const row = rows[i];
      const rowStr = row.join('|');
      // 檢查這一行是否包含多個關鍵欄位
      const hasKeywords = (row.some(c => String(c||'').includes('手術日期')) || 
                          row.some(c => String(c||'').includes('手術別'))) &&
                         (row.some(c => String(c||'').includes('科別')) || 
                          row.some(c => String(c||'').includes('科別名稱')));
      
      if(hasKeywords){
        hdr = i;
        console.log(`✓ 找到表頭於第 ${i} 行`);
        break;
      }
    }
    
    const H = rows[hdr];
    console.log(`📋 表頭共 ${H.length} 列`);
    console.log(`📝 前5列: ${H.slice(0,5).map((c,i)=>`${i}:"${c}"`).join(', ')}`);
    
    const findCol = (keywords) => {
      // 更容錯的列查找：支持任何包含關鍵字的列
      for(let i=0; i<H.length; i++){
        const cell = String(H[i]||'').trim();
        if(cell.length === 0) continue;
        
        // 精確匹配或包含匹配
        if(keywords.some(kw => 
          cell === kw || 
          cell.includes(kw) || 
          kw.includes(cell)
        )) {
          console.log(`✓ 找到"${keywords[0]}": 列${i}`);
          return i;
        }
      }
      console.warn(`✗ 未找到"${keywords[0]}"`);
      return -1;
    };
    
    // 根據實際表頭對應
    const iDate = findCol(['手術日期']);
    const iChart = findCol(['病歷號']);
    const iID = findCol(['身分證號']);
    const iName = findCol(['病患姓名']);
    const iType = findCol(['手術別']);
    const iDept = findCol(['科別名稱']);
    const iSurg = findCol(['主手術名稱']);
    const iDoctor = findCol(['主刀醫師']);
    const iRoom = findCol(['房間']);
    const iWait = findCol(['到達等候室時間']);
    const iEnter = findCol(['進手術室時間']);
    const iOut = findCol(['出手術室時間']);
    const iAnesthesia = findCol(['麻醉方式']);
    
    // 調試信息
    console.log(`列索引: Date=${iDate}, Type=${iType}, Dept=${iDept}, Surg=${iSurg}, Name=${iName}`);
    
    // 驗證必要欄位
    if(iDate < 0 || iType < 0 || iDept < 0){
      console.error('❌ 必要欄位遺失:', {iDate, iType, iDept});
      console.log('📋 表頭列表:', H.slice(0,15));
      alert('❌ 找不到必要欄位\n✓ 需要：手術日期、手術別、科別名稱\n\n請按 F12 查看詳細信息');
      return null;
    }
    
    let data = rows.slice(hdr+1)
      .filter(r => {
        const dateVal = r[iDate];
        return dateVal && String(dateVal).trim().length > 0;
      })
      .filter(r => {
        if(iRoom < 0) return true;
        return String(r[iRoom]||'').trim().toUpperCase() !== 'DR';
      });
    
    console.log(`📊 篩選後資料: ${data.length}`);
    
    if(data.length === 0){
      alert('⚠️ 未找到有效手術資料');
      return null;
    }
    
    // 解析日期
    const fd = String(data[0][iDate]||'').trim();
    console.log('📅 日期:', fd);
    
    let month, year;
    const dateMatch = fd.match(/(\d{1,3})[\/-](\d{1,2})[\/-](\d{1,4})/);
    
    if(dateMatch){
      const [_, y, m] = dateMatch;
      year = y.length === 3 ? y : String(parseInt(y)-1911);
      month = `${year}年${parseInt(m)}月`;
    }else{
      year = String(new Date().getFullYear() - 1911);
      month = fd;
    }
    
    console.log('📅 年:', year, '月:', month);
    
    // 統計
    let total=0, emg=0, urgent=0, critical=0, inpatient=0, outpatient=0;
    const deptMap = {};
    const critRows = [];
    const urgRows = [];
    
    // 等待時間計算函數
    const parseTime = (s) => {
      if(!s) return null;
      const m = String(s).trim().match(/(\d+):(\d+)/);
      return m ? {h:+m[1], mi:+m[2]} : null;
    };
    
    const calcWaitMins = (row) => {
      // 計算：從「到達等候室時間」到「進手術室時間」的等待分鐘數
      if(iWait < 0 || iEnter < 0) return null;
      const t1 = parseTime(row[iWait]);   // 到達等候室時間
      const t2 = parseTime(row[iEnter]);  // 進手術室時間
      if(!t1 || !t2) return null;
      const diff = (t2.h*60 + t2.mi) - (t1.h*60 + t1.mi);
      return diff < 0 ? diff + 1440 : diff;
    };
    
    // 處理每一行
    data.forEach((row, idx) => {
      total++;
      const typeVal = iType >= 0 ? String(row[iType]||'') : '';
      const deptVal = String(row[iDept]||'未知').trim();
      
      // 分類統計
      if(typeVal.includes('危急')) critical++;
      else if(typeVal.includes('緊急')) urgent++;
      else if(typeVal.includes('急診')) emg++;
      else if(typeVal.includes('住院')) inpatient++;
      else if(typeVal.includes('門診')) outpatient++;
      
      // 科別統計
      if(!deptMap[deptVal]) {
        deptMap[deptVal] = {name:deptVal, total:0, critical:0, urgent:0, emg:0, inpatient:0, outpatient:0};
      }
      deptMap[deptVal].total++;
      if(typeVal.includes('危急')) deptMap[deptVal].critical++;
      else if(typeVal.includes('緊急')) deptMap[deptVal].urgent++;
      else if(typeVal.includes('急診')) deptMap[deptVal].emg++;
      else if(typeVal.includes('住院')) deptMap[deptVal].inpatient++;
      else if(typeVal.includes('門診')) deptMap[deptVal].outpatient++;
      
      // 危急和緊急詳細記錄
      if(typeVal.includes('危急') || typeVal.includes('緊急')){
        const waitMins = calcWaitMins(row);
        const rec = {
          date: String(row[iDate]||''),
          dept: deptVal,
          name: iName >= 0 ? String(row[iName]||'').trim() : '-',
          chart: iChart >= 0 ? String(row[iChart]||'').trim() : '-',
          id: iID >= 0 ? String(row[iID]||'').trim() : '-',
          surg: iSurg >= 0 ? String(row[iSurg]||'').trim() : '-',
          doctor: iDoctor >= 0 ? String(row[iDoctor]||'').trim() : '-',
          waitMins: waitMins,
          over: typeVal.includes('危急') ? (waitMins !== null && waitMins >= 30) : (waitMins !== null && waitMins >= 120)
        };
        
        if(typeVal.includes('危急')){
          critRows.push(rec);
        }else if(typeVal.includes('緊急')){
          urgRows.push(rec);
        }
      }
    });
    
    // 計算達成率
    const critOk = critRows.filter(r => !r.over).length;
    const urgOk = urgRows.filter(r => !r.over).length;
    const critRate = critRows.length > 0 ? (critOk/critRows.length*100).toFixed(1) : null;
    const urgRate = urgRows.length > 0 ? (urgOk/urgRows.length*100).toFixed(1) : null;
    
    const result = {
      month, year, total, emg, urgent, critical, inpatient, outpatient, gen:0,
      dept: Object.values(deptMap),
      critRows, urgRows, critRate, critOk, urgRate, urgOk
    };
    
    console.log('✅ 解析成功');
    console.log('📊 危急:', critical, '紧急:', urgent);
    
    return result;
    
  }catch(e){
    console.error('❌ 錯誤:', e);
    showToast('❌ 解析失敗');
    alert('錯誤:\n\n' + e.message);
    return null;
  }
}

// ═══ 上傳 ═══
function processFile(file){
  showToast('正在解析...');
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const d = parseFile(ev.target.result);
      if(!d){
        showToast('✗ 解析失敗，請檢查檔案格式');
        return;
      }
      
      // 用 年-月 作為key，避免覆蓋
      const monthKey = d.year + '-' + (d.month.match(/(\d+)月/) ? d.month.match(/(\d+)月/)[1].padStart(2,'0') : '00');
      window._yearData[monthKey] = d;
      window._currentYear = d.year;
      updateYearSelector();
      window._reportData = d;
      renderMonthly(d);
      renderCritical(d.critRows, d.critRate, d.critOk);
      renderUrgent(d.urgRows, d.urgRate, d.urgOk);
      
      // 更新年度報表：同一年的所有月份合併
      const annualYears = {};
      Object.keys(window._yearData).forEach(monthKey => {
        const monthData = window._yearData[monthKey];
        const year = monthData.year;
        
        if(!annualYears[year]){
          annualYears[year] = {
            year: year,
            total: 0,
            emg: 0,
            urgent: 0,
            critical: 0,
            inpatient: 0,
            outpatient: 0,
            dept: {}
          };
        }
        
        const aData = annualYears[year];
        aData.total += monthData.total;
        aData.emg += monthData.emg;
        aData.urgent += monthData.urgent || 0;
        aData.critical += monthData.critical || 0;
        aData.inpatient += monthData.inpatient;
        aData.outpatient += monthData.outpatient;
        
        // 合併科別資料
        monthData.dept.forEach(r => {
          if(!aData.dept[r.name]){
            aData.dept[r.name] = {name: r.name, total: 0, emg: 0, urgent: 0, critical: 0, inpatient: 0, outpatient: 0};
          }
          aData.dept[r.name].total += r.total;
          aData.dept[r.name].emg += r.emg || 0;
          aData.dept[r.name].urgent += r.urgent || 0;
          aData.dept[r.name].critical += r.critical || 0;
          aData.dept[r.name].inpatient += r.inpatient || 0;
          aData.dept[r.name].outpatient += r.outpatient || 0;
        });
      });
      
      // 將dept從object轉為array
      Object.keys(annualYears).forEach(year => {
        annualYears[year].dept = Object.values(annualYears[year].dept);
      });
      
      window._annualData = annualYears;
      renderAnnual(annualYears);
      
      saveMemory();
      showToast('✓ ' + d.month + ' 已載入並保存到本地記憶');
    }catch(e){
      console.error('完整錯誤:', e);
      showToast('✗ 錯誤: ' + e.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

['file-main', 'file-main2'].forEach(id => {
  const el = document.getElementById(id);
  if(el) el.onchange = e => {
    if(e.target.files[0]){
      console.log('📤 選擇檔案:', e.target.files[0].name);
      processFile(e.target.files[0]);
    }
  };
});

// 拖拽上傳
const dz = document.querySelector('.drop-zone');
if(dz){
  dz.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    dz.style.borderColor = 'var(--blue)';
    dz.style.backgroundColor = '#f0f7ff';
  });
  
  dz.addEventListener('dragleave', e => {
    e.preventDefault();
    dz.style.borderColor = 'var(--border)';
    dz.style.backgroundColor = '';
  });
  
  dz.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    dz.style.borderColor = 'var(--border)';
    dz.style.backgroundColor = '';
    
    if(e.dataTransfer.files[0]){
      console.log('📤 拖曳檔案:', e.dataTransfer.files[0].name);
      processFile(e.dataTransfer.files[0]);
    }
  });
}

// ═══ 頁面載入 ═══
window.addEventListener('load', () => {
  console.log('APP 正在載入...');
  if(loadMemory()){
    updateYearSelector();
    if(window._currentYear && window._yearData[window._currentYear]){
      const d = window._yearData[window._currentYear];
      renderMonthly(d);
      renderCritical(d.critRows, d.critRate, d.critOk);
      renderUrgent(d.urgRows, d.urgRate, d.urgOk);
    }
    if(Object.keys(window._annualData).length > 0){
      renderAnnual(window._annualData);
    }
    showToast('✓ 已從本地記憶載入資料');
  }
  console.log('APP 已就緒');
});

// ═══ GitHub 同步 ═══
async function saveToGitHub(){
  const s = getSettings();
  if(!s.token){showSettings(); return;}
  showToast('儲存中...');
  // 簡化版本，實際應連接GitHub API
  saveMemory();
  showToast('✓ 已保存到本地與雲端');
}

async function loadFromGitHub(){
  showToast('讀取中...');
  // 簡化版本
  setTimeout(() => showToast('✓ 讀取完成'), 500);
}

function exportExcel(){
  if(!window._reportData){showToast('⚠ 請先上傳資料'); return;}
  const d = window._reportData;
  const wb = XLSX.utils.book_new();
  const data = [['科別', '總台數', '住院', '門診', '急診']];
  d.dept.forEach(r => data.push([r.name, r.total, r.inpatient, r.outpatient, r.emg]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), '業務量');
  XLSX.writeFile(wb, '手術室業務量_' + d.month + '.xlsx');
}
